<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Apple touch icon: rounded square, TJ-red background with a cream
       "store badge" circle and the bold centered McQuackers mallard.
       Matches icon.svg (Option 3), scaled up for the iOS home screen. -->
  <rect width="180" height="180" rx="40" fill="#C8102E"/>
  <circle cx="90" cy="90" r="72" fill="#fdf6ec"/>
  <!-- Mallard head, centered (geometry mirrors icon.svg, scaled ~2.65x) -->
  <g transform="translate(90 98) scale(2.65)">
    <circle cx="0" cy="-2" r="17" fill="#0f6e3d"/>
    <ellipse cx="-5" cy="-10" rx="6" ry="3.4" fill="#1f8d52" opacity="0.6"/>
    <ellipse cx="1" cy="14" rx="14.5" ry="3" fill="#C8102E" opacity="0.85"/>
    <path d="M 12.5 -4.5 Q 31.5 -4.5 31.5 0 Q 31.5 6 14.5 3.5 Z" fill="#f4c430" stroke="#8a6a0a" stroke-width="0.7" stroke-linejoin="round"/>
    <circle cx="26" cy="-1.3" r="0.8" fill="#5a4400"/>
    <circle cx="5" cy="-5" r="2.7" fill="#1a1a1a"/>
    <circle cx="5.9" cy="-6" r="0.95" fill="#fff"/>
  </g>
</svg>

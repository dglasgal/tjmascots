<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- TJ Mascots favicon — McQuackers the mallard on a Trader Joe's-style
       red circle with a cream "store badge" ring. Redesigned 2026-06-28 to
       read clearly even at 16x16 (browser tab / Google result favicon):
       the mallard head is bigger and centered, eye + bill enlarged. -->
  <!-- TJ-red circle -->
  <circle cx="32" cy="32" r="32" fill="#C8102E"/>
  <!-- Cream store-badge ring -->
  <circle cx="32" cy="32" r="27" fill="#fdf6ec"/>
  <!-- Mallard head (bold, centered) -->
  <g transform="translate(33 35)">
    <circle cx="0" cy="-2" r="17" fill="#0f6e3d"/>
    <!-- subtle head-sheen highlight -->
    <ellipse cx="-5" cy="-10" rx="6" ry="3.4" fill="#1f8d52" opacity="0.6"/>
    <!-- red collar nod (sits on cream so it stays visible) -->
    <ellipse cx="1" cy="14" rx="14.5" ry="3" fill="#C8102E" opacity="0.85"/>
    <!-- bill -->
    <path d="M 12.5 -4.5 Q 31.5 -4.5 31.5 0 Q 31.5 6 14.5 3.5 Z" fill="#f4c430" stroke="#8a6a0a" stroke-width="0.7" stroke-linejoin="round"/>
    <!-- nostril -->
    <circle cx="26" cy="-1.3" r="0.8" fill="#5a4400"/>
    <!-- eye -->
    <circle cx="5" cy="-5" r="2.7" fill="#1a1a1a"/>
    <circle cx="5.9" cy="-6" r="0.95" fill="#fff"/>
  </g>
</svg>
